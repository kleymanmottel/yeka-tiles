<style>
/* Layout: one full-screen tile board (canvas) with the Yeka game-look menus on top. Single deliberate look. */
:root{--ink:#14204a;--blue:#2f6df0;--blue2:#1f55cf;--yel:#ffd23f;--yel2:#f5a300;--grn:#25c26b;--grn2:#169a51;--red:#ff4d5e;--paper:#f6f8fe;--line:#dfe6f5;
  --f-game:'Rubik','Arial Black',system-ui,sans-serif;--f-body:'Nunito',system-ui,sans-serif;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(120% 80% at 50% 0%,#6db3ff,#3b7ff2 50%,#2a5fd6)}
#board{position:relative;height:100%;width:min(100%,calc(100vh * .62));background:var(--paper);box-shadow:0 0 40px rgb(10 20 60 / .35)}
canvas{display:block;width:100%;height:100%}
.big{font-family:var(--f-game);font-weight:900;color:#fff;line-height:1;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 22px;border-radius:999px;text-align:center;
  font-family:var(--f-game);font-weight:800;font-size:19px;line-height:1.1;color:var(--ink);background:linear-gradient(#ffe57a,var(--yel) 50%,var(--yel2));
  box-shadow:inset 0 -4px 0 rgb(0 0 0 / .12),inset 0 2px 0 rgb(255 255 255 / .55),0 4px 0 #b36d00;max-width:100%}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -4px 0 rgb(0 0 0 / .12),0 1px 0 #b36d00}
.btn:focus-visible,.rb:focus-visible,.song:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.bl{background:linear-gradient(#78b2ff,var(--blue) 50%,var(--blue2));color:#fff;box-shadow:inset 0 -4px 0 rgb(0 0 0 / .12),inset 0 2px 0 rgb(255 255 255 / .35),0 4px 0 #13399a}
.btn.gr{background:linear-gradient(#6fe3a0,var(--grn) 50%,var(--grn2));color:#fff;box-shadow:inset 0 -4px 0 rgb(0 0 0 / .12),0 4px 0 #0e6e39}
.btn.off{background:linear-gradient(#ff8a95,var(--red) 50%,#d93445);color:#fff;box-shadow:inset 0 -4px 0 rgb(0 0 0 / .12),0 4px 0 #9c1f2c}
.btn.sm{min-height:42px;font-size:15px;padding:6px 16px}
.btn.w{width:100%}
.rb{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:rgb(20 32 74 / .55);color:#fff}
.rb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rb.red{background:linear-gradient(#ff8a95,var(--red));box-shadow:0 3px 0 #9c1f2c}
/* overlays */
.scrn{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:10;overflow:auto;color:#fff}
.scrn.blue{background:radial-gradient(120% 70% at 50% 0%,#6db3ff,#3b7ff2 45%,#2a5fd6)}
.scrn.dim{background:rgb(11 18 48 / .72);align-items:center;justify-content:center;text-align:center}
.hdr{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--f-game);font-weight:900;font-size:40px;color:var(--yel);transform:rotate(-3deg);line-height:.95;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 6px 0 var(--ink)}
.keys{display:flex;gap:3px;height:34px;margin-top:6px}.keys i{width:16px;background:#fff;border-radius:0 0 5px 5px;position:relative}.keys i.b::after{content:"";position:absolute;right:-7px;top:0;width:11px;height:20px;background:var(--ink);border-radius:0 0 3px 3px;z-index:1}
.songs{display:flex;flex-direction:column;gap:10px}
.song{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:24px;padding:10px 12px;box-shadow:0 4px 0 rgb(20 32 74 / .2)}
.song .disc{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.song .disc svg{width:28px;height:28px;fill:#fff}
.song b{font-family:var(--f-game);font-weight:800;font-size:17px;line-height:1.1;display:block}
.song.lock{background:#eef1f8}.song.lock b{color:#5d6788}
.total{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgb(20 32 74 / .35);border-radius:999px;padding:6px 14px 6px 8px;font-family:var(--f-game);font-weight:800;font-size:15px}.total svg{width:24px;height:24px}.total b{color:var(--yel);font-size:18px}
.tagN{display:inline-block;font-style:normal;font-family:var(--f-game);font-weight:800;font-size:11px;color:#8a5a12;background:#fff1c9;border-radius:999px;padding:1px 8px;margin:2px 0}
.song small{font-weight:800;font-size:12px;color:#5d6788}
.stars{display:inline-flex;gap:2px;vertical-align:middle}.stars svg{width:16px;height:16px}
.panel{background:#fff;color:var(--ink);border-radius:28px;padding:20px 18px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 rgb(0 0 0 / .25)}
.set{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.set>div{display:flex;flex-direction:column;gap:6px;min-width:0}.set span{font-family:var(--f-game);font-weight:800;font-size:13px;text-align:center}
.note{background:rgb(255 255 255 / .16);border-radius:20px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.4}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
#hud .row{display:flex;align-items:center;gap:10px;width:100%}
#hud .rb{pointer-events:auto;background:rgb(255 255 255 / .35)}
#score{font-family:Oswald,var(--f-game);font-weight:600;font-size:46px;color:#f2555a;flex:1;text-align:center;text-shadow:none;letter-spacing:1px}
#prog{width:min(220px,60%);height:8px;border-radius:4px;background:rgb(255 255 255 / .45);position:relative}
#prog i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#ffd23f,#f5a300)}
#prog b{position:absolute;top:50%;transform:translate(-50%,-50%);width:22px;height:22px}
#lyr{max-width:92%;background:rgb(255 255 255 / .92);border-radius:999px;padding:6px 14px;font-family:var(--f-game);font-weight:700;font-size:17px;color:#9aa3bf;box-shadow:0 3px 0 rgb(20 32 74 / .15);text-align:center;line-height:1.25}
#nudge{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgb(255 255 255 / .94);border-radius:999px;padding:4px 6px;box-shadow:0 3px 0 rgb(20 32 74 / .15);font-family:var(--f-game);font-weight:800;font-size:14px;color:var(--ink)}
#nudge .btn{min-height:34px;padding:2px 12px;font-size:14px}#nudge b{min-width:64px;text-align:center}
#lyr.k{border-radius:22px;padding:8px 16px;font-size:19px;max-width:94%}
#lyr.k .ln{background:linear-gradient(90deg,var(--blue) var(--p,0%),#9aa3bf var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
#lyr.k .nx{display:block;font-size:13px;color:#9aa3bf;margin-top:2px}
#mark{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgb(255 255 255 / .96);box-shadow:0 -4px 0 rgb(20 32 74 / .12);display:flex;flex-direction:column;gap:8px;color:var(--ink)}
#mark .mt{font-family:var(--f-game);font-weight:800;font-size:13px;color:#5d6788}
#mark .mn{font-family:var(--f-game);font-weight:800;font-size:17px;line-height:1.2}
#mark .mb{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}#mark .mb .btn{min-height:46px;padding:4px 8px;font-size:14px}
#mark .mr{display:flex;gap:8px}#mark .mr .btn{flex:1;min-height:36px;font-size:13px;padding:2px 8px}
.scrn.res{background:#fff;padding:0;gap:0;color:var(--ink)}
.resTop{position:relative;background:radial-gradient(120% 90% at 50% 0%,#8cc4ff,#4a8ef5 55%,#2f6df0);padding:calc(28px + env(safe-area-inset-top,0px)) 16px 64px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;text-align:center}
.resSong{font-family:var(--f-game);font-weight:800;font-size:20px}
.resStars{display:flex;gap:10px}.resStars svg{width:64px;height:64px;filter:drop-shadow(0 4px 0 rgb(0 0 0 / .15))}
.resScore{font-family:Oswald,var(--f-game);font-weight:600;font-size:84px;line-height:1;letter-spacing:2px}
#oBest{font-family:var(--f-game);font-weight:800;font-size:15px}
#oBest.ribbon{background:#22c3b0;color:#fff;padding:6px 18px;border-radius:6px;box-shadow:0 3px 0 #13897b;transform:rotate(-2deg)}
.resTitle{font-family:var(--f-game);font-weight:800;font-size:15px;opacity:.9}
.hills{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:56px}
.resBtns{display:flex;align-items:center;justify-content:center;gap:16px;padding:28px 16px calc(24px + env(safe-area-inset-bottom,0px));margin-top:auto}
.rbtn{all:unset;cursor:pointer;width:58px;height:58px;border-radius:50%;border:3px solid #4a8ef5;color:#4a8ef5;display:flex;align-items:center;justify-content:center}
.rbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.rbtn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.resAgain{min-width:180px}
.resNext{margin:22px 16px 0;padding:14px 16px;border-radius:18px;background:#f1f5ff;font-family:var(--f-game);font-weight:800;font-size:15px;line-height:1.35;text-align:center;color:var(--ink)}.resNext b{color:#f5a300}
#lyr .on{color:var(--blue)}#lyr .now{color:var(--ink)}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:20;text-align:center;white-space:normal!important;width:min(92%,420px);font-size:30px!important;font-size:38px;transition:opacity .4s;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.btn:active{transform:none}}
</style>

const WORDS_R={};
const NOTE_IDX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const midiOf=n=>{const m=/^([A-G][#b]?)(\d)$/.exec(n);return 12*(+m[2]+1)+NOTE_IDX[m[1]]};
const COLS=4,VIS=4;
/* a written melody (warm-up) -> same score format: 1 beat = 1 row */
function scoreFromNotes(s){let row=0,col=1,prev=null;const tiles=[];
  s.notes.trim().split(/\s+/).forEach(tok=>{const m=/^([A-G]#?b?\d)(?::([\d.]+))?$/.exec(tok);if(!m)return;const p=midiOf(m[1]),d=Math.round(parseFloat(m[2]||'1'));
    if(prev!==null){const dp=p-prev;if(dp===0)col=(col+2)%COLS;else{let c=col+Math.sign(dp);if(c<0||c>=COLS)c=col-Math.sign(dp);col=c}}prev=p;
    tiles.push([row,d,col,[0,p,d*100,96]]);row+=d});
  return {rps:s.bpm/60,tiles}}
SONGS.forEach(s=>{const raw=s.notes?scoreFromNotes(s):SCORES[s.id];s.score={rps:raw.rps,tiles:raw.tiles.map(([row,len,col,ns,ch],i)=>({row,len,col,ns,ch:ch||[],i}))}});

save.words=save.words||{};save.best=save.best||{};
const persist=()=>{try{localStorage.setItem('yekaTiles.v2',JSON.stringify(save))}catch(e){}};
const T=()=>TX[save.lang]||TX.ru;const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const totalStars=()=>Object.values(save.best).reduce((a,b)=>a+Math.min(3,b.stars||0),0);

/* ---------------- piano sound ---------------- */
let ac=null,master=null,voices=[];
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
  master=ac.createGain();master.gain.value=.9;master.connect(comp).connect(ac.destination)}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume();return ac}
/* Piano notes are made once per pitch (in the background, before the song starts) and then played back as ready-made sounds.
   This is much lighter for phones than building every note from oscillators while playing. */
const SR=22050,NL=3.2;const bank={};
function synthInto(oc,p,t0){const f=440*Math.pow(2,(p-69)/12),decay=Math.max(.7,3.2-(p-48)*.04);
  const g=oc.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.5,t0+.004);g.gain.setTargetAtTime(.25,t0+.004,.12);g.gain.setTargetAtTime(0.0001,t0+.06,decay*.9);g.gain.setTargetAtTime(0,t0+NL-.15,.04);
  const lp=oc.createBiquadFilter();lp.type='lowpass';lp.Q.value=.3;lp.frequency.setValueAtTime(Math.min(9000,f*10),t0);lp.frequency.setTargetAtTime(Math.max(900,f*2.5),t0,.35);lp.connect(g).connect(oc.destination);
  [[1,.6,0],[2,.28,3],[3,.12,-4],[4,.06,5],[1,.25,6]].forEach(([mul,amp,det])=>{const o=oc.createOscillator(),og=oc.createGain();o.type=mul===1&&det?'triangle':'sine';o.frequency.value=f*mul*(1+.0004*mul*mul);o.detune.value=det;og.gain.value=amp;
    if(mul>1){og.gain.setValueAtTime(amp,t0);og.gain.setTargetAtTime(0,t0,.25/mul)}o.connect(og).connect(lp);o.start(t0);o.stop(t0+NL)})}
async function prepare(pitches){const a=audio();if(!a)return;const need=[...new Set(pitches)].filter(p=>!bank[p]);if(!need.length)return;
  const L=Math.round(SR*NL);const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,L*need.length,SR);need.forEach((p,i)=>synthInto(oc,p,i*NL));
  const buf=await oc.startRendering();const d=buf.getChannelData(0);
  need.forEach((p,i)=>{const b=a.createBuffer(1,L,SR);const ch=b.getChannelData(0);ch.set(d.subarray(i*L,i*L+L));bank[p]=b})}
function note(p,when,dur,vel=90,sustain=false){if(!save.sound)return null;const a=audio();if(!a||!bank[p])return null;
  const t0=Math.max(a.currentTime,when),v=Math.min(1,vel/110)*(p<48?.42:p<60?.4:.46);const len=Math.min(sustain?NL-.2:NL-.4,Math.max(.25,dur));
  const s=a.createBufferSource();s.buffer=bank[p];const g=a.createGain();g.gain.setValueAtTime(v,t0);g.gain.setTargetAtTime(0,t0+len,.08);s.connect(g).connect(master);s.start(t0);s.stop(Math.min(t0+NL,t0+len+.5));
  const voice={g,end:t0+len+.5};voices.push(voice);if(voices.length>48){voices=voices.filter(x=>x.end>a.currentTime)}
  return voice}
function stopVoice(v){if(!v||!ac)return;try{v.g.gain.cancelScheduledValues(ac.currentTime);v.g.gain.setTargetAtTime(0,ac.currentTime,.06)}catch(e){}}
function buzz(){if(!save.sound)return;const a=audio();if(!a)return;const t0=a.currentTime;[220,233].forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.08,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.5);o.connect(g).connect(master);o.start(t0);o.stop(t0+.55)})}
function stopAll(){voices.forEach(stopVoice);voices=[]}

/* ---------------- board (sharp on every screen) ---------------- */
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){const b=$('board').getBoundingClientRect();DPR=Math.min(Math.max(1,window.devicePixelRatio||1),2);W=b.width;H=b.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
new ResizeObserver(resize).observe($('board'));window.addEventListener('resize',resize);resize();
const rowH=()=>H/VIS;

/* ---------------- game state ---------------- */
let lap=0,lapRow=0,lap0=0,bgStage=-1,pops=[],state='menu',song=null,tiles=[],score=0,started=false,scroll=0,speedMul=1,hits=0,starsNow=0,failT=0,failTile=null,failX=null,holds=new Map(),flash=[],toastT=0,genI=0;
const rps=()=>song.score.rps*speedMul;
function genTiles(){const all=song.score.tiles;
  while(true){if(genI>=all.length){if(lap>=3||save.test)break;/* next round (crowns): the song starts again, a bit faster */lap++;lapRow+=all[all.length-1].row+all[all.length-1].len+2;genI=0}
    const t=all[genI];if(t.row+lapRow>=scroll+VIS+2)break;genI++;tiles.push({...t,row:t.row+lapRow,lap,hit:false,held:0,done:false,start:t.i===0&&lap===0})}}
function begin(s){song=s;tiles=[];genI=0;lap=0;lapRow=0;lap0=0;pops=[];bgStage=-1;score=0;hits=0;starsNow=0;started=false;speedMul=1;scroll=-.35;failT=0;failTile=null;failX=null;holds.clear();flash=[];kLine=-2;
  genTiles();state='play';showOnly(null);$('hud').hidden=false;updHud();markShow();renderWords();
  if(save.test)setTimeout(()=>{if(state==='play'&&!started){const n=nextTile();if(n)hit(n,'auto')}},500)}
function nextTile(){return tiles.find(t=>!t.hit)}
function rowY(row){return H-(row-scroll)*rowH()}
function tileRect(t){const y2=rowY(t.row),y1=rowY(t.row+t.len);const w=W/COLS;return {x:t.col*w,y:y1,w,h:y2-y1}}

/* play the notes of a tile: they are spread over the time until the next tile, at the current speed */
function playTile(t){const a=audio();if(!a)return null;const now=a.currentTime,sec=1/rps();let mel=null;
  for(let k=0;k<t.ns.length;k+=4){const off=t.ns[k]/100,p=t.ns[k+1],dur=t.ns[k+2]/100,vel=t.ns[k+3];
    const v=note(p,now+off*sec,dur*sec,vel,t.len>1&&off<.05);if(t.len>1&&off<.05&&v)(t.vs||(t.vs=[])).push(v)}
  for(let k=0;k<t.ch.length;k+=4)note(t.ch[k+1],now+t.ch[k]/100*sec,t.ch[k+2]/100*sec,t.ch[k+3],true);
  return mel}

/* ---------------- input ---------------- */
function tapAt(x,y,id){if(state!=='play')return;audio();if(save.test)return;
  const t=nextTile();if(!t)return;const r=tileRect(t);const col=Math.floor(x/(W/COLS));
  const inTile=col===t.col&&y>=r.y-rowH()*.25&&y<=Math.min(H,r.y+r.h+rowH()*.5);
  if(inTile){hit(t,id);return}
  /* tapping a tile you already played (or the long tile you are holding) is fine */
  const onPlayed=tiles.some(o=>o.hit&&col===o.col&&(()=>{const q=tileRect(o);return y>=q.y&&y<=q.y+q.h})());
  if(!onPlayed)fail(null,col,y)}
function hit(t,id){t.hit=true;hits++;score++;
  if(!started){started=true}
  playTile(t);
  if(t.len>1){holds.set(id,t);t.holding=true}else t.done=true;
  flash.push({t,a:1});checkStars();updHud()}
function release(id){const t=holds.get(id);if(!t)return;holds.delete(id);endHold(t)}
function endHold(t){if(!t.holding)return;t.holding=false;t.done=true;const bonus=Math.floor(t.held*(t.len-1)+.001);score+=bonus;if(bonus>0)pops.push({t,txt:'+'+bonus,a:1});if(t.held<.98&&t.vs)t.vs.forEach(stopVoice);updHud()}
/* like Piano Tiles 2: three stars through the song, then each new round (a little faster) earns a crown */
function checkStars(){const n=song.score.tiles.length;
  if(hits>=n*(lap0+1)){lap0++;if(lap0>=4||save.test){setTimeout(()=>{if(state==='play')endGame(true)},800)}}
  const st=Math.min(6,lap0===0?Math.floor(hits/n*3+1e-9):2+lap0);
  if(st>starsNow){starsNow=st;speedMul*=st===3?1.1:1.06;toast(st<3?'★'.repeat(st)+' '+T().faster:st===3?T().stars3:'👑'.repeat(st-3)+' '+T().crown)}}
function fail(tile,col,y){if(state!=='play')return;state='fail';failT=0;failTile=tile;failX=tile?null:{col,row:Math.floor(scroll+(H-y)/rowH())};stopAll();buzz()}
cv.addEventListener('pointerdown',e=>{const b=cv.getBoundingClientRect();try{cv.setPointerCapture(e.pointerId)}catch(_){}tapAt(e.clientX-b.left,e.clientY-b.top,e.pointerId);e.preventDefault()});
cv.addEventListener('pointerup',e=>release(e.pointerId));cv.addEventListener('pointercancel',e=>release(e.pointerId));cv.addEventListener('lostpointercapture',e=>release(e.pointerId));
const KEYS={d:0,f:1,j:2,k:3,D:0,F:1,J:2,K:3,'в':0,'а':1,'о':2,'л':3};
window.addEventListener('keydown',e=>{if(e.repeat)return;if(state==='play'&&e.key in KEYS&&!save.test){const t=nextTile();if(!t)return;const c=KEYS[e.key];const r=tileRect(t);
  if(c===t.col)hit(t,'k'+c);else fail(null,c,r.y+r.h/2);e.preventDefault()}else if(e.key==='Escape')pause()});
window.addEventListener('keyup',e=>{if(e.key in KEYS)release('k'+KEYS[e.key])});

/* ---------------- HUD + words ---------------- */
const starSvg=(on)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.3 6.9.9-5 4.8 1.3 6.8L12 17.6l-6.2 3.2 1.3-6.8-5-4.8 6.9-.9z" fill="${on?'#ffd23f':'#d5dbe8'}" stroke="#14204a" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const lockSvg=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="3" fill="#fff"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;
let lastStars=-1;
function updHud(){$('score').textContent=score;const n=song.score.tiles.length;const p=lap0>=1?Math.min(1,(hits-n*lap0)/n):hits/n;$('progFill').style.width=(Math.max(0,p)*100)+'%';const st=lap0>=1?3:Math.floor(p*3+1e-9);
  if(st!==lastStars){lastStars=st;$('prog').querySelectorAll('b').forEach(b=>b.remove());[1,2,3].forEach(k=>{const b=document.createElement('b');b.style.left=(k/3*100)+'%';b.innerHTML=starSvg(st>=k);$('prog').appendChild(b)})}}
const wordsOf=id=>save.words[id]||WORDS_R[id]||null;
let kLine=-2;
function renderWords(){const el=$('lyr');const L=song&&LYRICS[song.id],ev=song&&wordsOf(song.id);
  if(!save.lyrics||!L||!ev||!ev.length){el.hidden=true;return}
  const pos=started?scroll+.5:-1;let i=-1;for(let k=0;k<ev.length;k++){if(ev[k][0]<=pos)i=k;else break}
  const line=i<0?-1:ev[i][1];el.classList.add('k');
  if(line<0){const nx=ev.find(e=>e[0]>pos&&e[1]>=0);if(!nx||(nx[0]-pos)/rps()>2.5){el.hidden=true;kLine=-2;return}
    if(kLine!==-3){kLine=-3;el.hidden=false;el.innerHTML=`<span class="ln" style="--p:0%">${esc(L.lines[nx[1]])}</span>`}return}
  const r0=ev[i][0],r1=ev[i+1]?ev[i+1][0]:r0+8;const pct=Math.max(0,Math.min(100,(pos-r0)/Math.max(1,(r1-r0)*.85)*100));
  if(kLine!==i){kLine=i;el.hidden=false;const nxt=ev[i+1]&&ev[i+1][1]>=0?L.lines[ev[i+1][1]]:'';el.innerHTML=`<span class="ln">${esc(L.lines[line])}</span>${nxt?`<span class="nx">${esc(nxt)}</span>`:''}`}
  el.querySelector('.ln').style.setProperty('--p',pct.toFixed(1)+'%')}
function toast(txt){$('toast').textContent=txt;$('toast').style.opacity=1;toastT=1.3}

/* word timer (song check): mark the row where each line starts */
let mk=null;
function markShow(){const on=save.test&&!!LYRICS[song.id];$('mark').hidden=!on;if(!on){mk=null;return}mk={ev:[],ptr:0};markText()}
function markText(){const t=T(),L=LYRICS[song.id];$('mkT').textContent=t.mkT;$('mkLine').textContent=t.mkLine;$('mkChorus').textContent=t.mkChorus;$('mkBreak').textContent=t.mkBreak;$('mkUndo').textContent=t.mkUndo;$('mkCopy').textContent=t.mkCopy;
  $('mkNext').textContent=mk.ptr<L.lines.length?`${t.mkNx} ${L.lines[mk.ptr]}`:t.mkDone}
function markAdd(line){if(!mk||!started)return;mk.ev.push([Math.round((scroll+.5)*10)/10,line]);if(line>=0)mk.ptr=line+1;markSave()}
function markSave(){save.words[song.id]=mk.ev.slice();persist();kLine=-2;markText()}
$('mkLine').onclick=()=>{if(!mk)return;const L=LYRICS[song.id];if(mk.ptr<L.lines.length)markAdd(mk.ptr)};
$('mkChorus').onclick=()=>{if(mk)markAdd(LYRICS[song.id].chorus)};
$('mkBreak').onclick=()=>{if(mk)markAdd(-1)};
$('mkUndo').onclick=()=>{if(!mk||!mk.ev.length)return;mk.ev.pop();const last=[...mk.ev].reverse().find(e=>e[1]>=0);mk.ptr=last?last[1]+1:0;markSave()};
$('mkCopy').onclick=()=>{const txt='YEKA-WORDS '+song.id+' '+JSON.stringify(save.words[song.id]||[]);
  const done=()=>{$('mkCopy').textContent=T().mkCopied;setTimeout(()=>{if(mk)markText()},1500)};
  try{navigator.clipboard.writeText(txt).then(done,()=>prompt('',txt))}catch(e){prompt('',txt)}};
window.addEventListener('keydown',e=>{if(!mk||state!=='play')return;if(e.key===' '||e.key==='Enter'){$('mkLine').click();e.preventDefault()}else if(e.key==='c'||e.key==='с'){$('mkChorus').click()}else if(e.key==='b'||e.key==='и'){$('mkBreak').click()}else if(e.key==='Backspace'){$('mkUndo').click();e.preventDefault()}});

/* ---------------- draw ---------------- */
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* the Piano Tiles look: a soft glowing background that changes colour as you earn stars, flat black tiles, see-through played tiles */
const STAGES=[['#6f9cff','#9fd0ff','#c9e6ff'],['#8f8cff','#b9b2ff','#e2d4ff'],['#c78fe8','#f0b1d9','#ffd9e8'],['#5fc9d8','#8de3e0','#d7fbf3'],['#ffb36b','#ffd07a','#fff0c4'],['#ff8fa3','#ffb3c1','#ffe3ea']];
let bgC=null;const parts=[];
function makeBg(stage){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(W));c.height=Math.max(1,Math.round(H));const g=c.getContext('2d');const [a,b,d]=STAGES[Math.min(stage,STAGES.length-1)];
  const lg=g.createLinearGradient(0,H,W*.3,0);lg.addColorStop(0,a);lg.addColorStop(.6,b);lg.addColorStop(1,d);g.fillStyle=lg;g.fillRect(0,0,W,H);
  let r=7+stage*13;const rnd=()=>{r=(r*16807)%2147483647;return (r-1)/2147483646};
  for(let i=0;i<16;i++){const x=rnd()*W,y=rnd()*H,rad=20+rnd()*W*.28;const rg=g.createRadialGradient(x,y,0,x,y,rad);rg.addColorStop(0,'rgba(255,255,255,.28)');rg.addColorStop(.7,'rgba(255,255,255,.08)');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.beginPath();g.arc(x,y,rad,0,7);g.fill()}
  bgC=c;$('board').style.background=`url(${c.toDataURL('image/jpeg',.85)}) center/100% 100% no-repeat`;if(!parts.length)for(let i=0;i<12;i++)parts.push({x:Math.random(),y:Math.random(),s:.5+Math.random()*1.4,v:.01+Math.random()*.03})}
function draw(){const w=W/COLS,rh=rowH();const stage=Math.min(starsNow,5);
  if(stage!==bgStage||!bgC||bgC.width!==Math.round(W)){bgStage=stage;makeBg(stage)}
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';const now=performance.now();for(const p of parts){p.y-=p.v*(state==='play'&&started?.016:.004);if(p.y<-.02)p.y=1.02;ctx.globalAlpha=.3+.35*Math.sin(p.x*40+now/900);ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.s,0,7);ctx.fill()}ctx.globalAlpha=1;
  const px=1/(cv.width/W);ctx.fillStyle='rgba(255,255,255,.6)';for(let c=1;c<COLS;c++)ctx.fillRect(Math.round(c*w)-px*.5,0,px,H);
  for(const t of tiles){const r=tileRect(t);if(r.y>H||r.y+r.h<0)continue;const x=r.x+px,y=r.y+px,ww=r.w-px*2,hh=r.h-px*2;
    if(t.hit&&!t.holding){ctx.fillStyle='rgba(255,255,255,.26)';ctx.fillRect(x,y,ww,hh);if(t.len>1&&t.held>0){ctx.fillStyle='rgba(120,210,255,.30)';ctx.fillRect(x,y+hh*(1-t.held),ww,hh*t.held)}continue}
    ctx.fillStyle=t.start?'#2f6df0':'#0b0b10';ctx.fillRect(x,y,ww,hh);
    if(t.len>1){const cx=x+ww/2;const fh=t.holding?hh*Math.min(1,t.held):0;const ringY=Math.max(y+16,y+hh-fh-rh*.32);
      if(fh>0){const gg=ctx.createLinearGradient(0,y+hh-fh,0,y+hh);gg.addColorStop(0,'#9fe6ff');gg.addColorStop(1,'#3fb6f0');ctx.fillStyle=gg;ctx.fillRect(x,y+hh-fh,ww,fh)}
      ctx.strokeStyle='rgba(95,215,235,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,ringY);ctx.lineTo(cx,y+12);ctx.stroke();
      ctx.strokeStyle='#5fd7eb';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,ringY,Math.min(14,w*.11),0,7);ctx.stroke()}
    if(t.start&&!started){ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(Math.min(w*.22,rh*.22))}px Oswald, Rubik, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(T().start,x+ww/2,y+hh/2)}
    if(state==='fail'&&failTile===t&&Math.floor(failT*6)%2===0){ctx.fillStyle='rgba(255,70,80,.9)';ctx.fillRect(x,y,ww,hh)}}
  if(state==='fail'&&failX&&Math.floor(failT*6)%2===0){ctx.fillStyle='rgba(255,70,80,.85)';const y2=rowY(failX.row),y1=rowY(failX.row+1);ctx.fillRect(failX.col*w+px,y1+px,w-px*2,y2-y1-px*2)}
  for(let i=flash.length-1;i>=0;i--){const f=flash[i];const r=tileRect(f.t);ctx.fillStyle=`rgba(255,255,255,${f.a*.5})`;ctx.fillRect(r.x,r.y,r.w,r.h);f.a-=.1;if(f.a<=0)flash.splice(i,1)}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`600 ${Math.round(w*.26)}px Oswald, Rubik, sans-serif`;
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];const r=tileRect(p.t);ctx.fillStyle=`rgba(40,150,225,${p.a})`;const px2=p.t.col<COLS-1?r.x+r.w*1.5:r.x-r.w*.5;ctx.fillText(p.txt,px2,r.y+r.h-rh*.5-(1-p.a)*30);p.a-=.02;if(p.a<=0)pops.splice(i,1)}}

/* ---------------- loop ---------------- */
let last=performance.now();
function update(dt){
  if(state==='play'&&started){scroll+=rps()*dt;
    if(save.test){const n=nextTile();if(n&&scroll>=n.row-.15)hit(n,'auto');tiles.forEach(t=>{if(t.holding&&holds.get('auto')===t&&t.held>=1)release('auto')})}
    for(const t of tiles)if(t.holding){t.held=Math.max(0,Math.min(1,(scroll-t.row+.15)/Math.max(.5,t.len-.35)));if(t.held>=1){for(const [k,v] of holds)if(v===t)holds.delete(k);endHold(t)}}
    const t=nextTile();if(t&&scroll>t.row+.2){fail(t);scroll=t.row-.3}
    genTiles();tiles=tiles.filter(x=>x.row+x.len>scroll-1||!x.hit);renderWords()}
  if(state==='fail'){failT+=dt;if(failT>1.3)endGame(false)}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(state!=='paused')update(dt);if(state!=='menu'&&state!=='loading')draw();requestAnimationFrame(frame)}

/* ---------------- screens ---------------- */
function showOnly(id){['menu','settings','over','pauseScr','loading'].forEach(s=>$(s).hidden=s!==id);if(id!==null&&id!=='loading'&&state!=='over')state=id==='menu'?'menu':state}
const crownSvg=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18l1-11-6 4-4-7-4 7-6-4z" fill="${on?'#ffc531':'#d5dbe8'}" stroke="#c98a00" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
function starsRow(n){return [1,2,3].map(k=>starSvg(k<=n)).join('')}
function applyText(){const t=T();document.documentElement.lang=save.lang;const tot=totalStars();
  $('mTag').textContent=t.tag;$('mNote').textContent=t.note;$('mTotal').innerHTML=`${starSvg(true)} <span>${t.total}: <b>${tot}</b></span>`;
  $('songList').innerHTML=SONGS.map((s,i)=>{const b=save.best[s.id]||{score:0,stars:0};const open=isOpen(s);
    return `<button class="song${open?'':' lock'}" type="button" data-i="${i}"><span class="disc" style="background:${open?s.color:'#9aa3bf'}">${open?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>':lockSvg}</span><span style="flex:1;min-width:0"><b>${esc(s.title[save.lang])}</b>${s.nigun?`<i class="tagN">${t.nigun[s.nigun]}</i>`:''}${open?`<small>${t.best}: ${b.score}</small> <span class="stars">${starsRow(b.stars)}</span>`:`<small>${t.locked(s.need)}</small>`}</span><span class="btn sm${open?'':' off'}" style="pointer-events:none">${open?'▶':'🔒'}</span></button>`}).join('');
  $('songList').querySelectorAll('.song').forEach(b=>b.onclick=()=>pick(SONGS[+b.dataset.i]));
  $('sTitle').textContent=t.sTitle;$('sSound').textContent=t.sound;$('sLyrics').textContent=t.lyrics;$('sLang').textContent=t.lang;$('sTest').textContent=t.test;$('sAdmin').textContent=t.admin;$('testRow').hidden=!save.admin;$('sHow').textContent=t.how+(save.test?' '+t.testHow:'');
  const sb=$('soundBtn'),lb=$('lyrBtn'),tb=$('testBtn');sb.textContent=save.sound?t.on:t.off;sb.className='btn sm '+(save.sound?'gr':'off');lb.textContent=save.lyrics?t.on:t.off;lb.className='btn sm '+(save.lyrics?'gr':'off');tb.textContent=save.test?t.on:t.off;tb.className='btn sm '+(save.test?'gr':'off');const ab=$('adminBtn');ab.textContent=save.admin?t.on:t.off;ab.className='btn sm '+(save.admin?'gr':'off');$('langBtn').textContent=t.langV;
  $('againBtn').textContent=t.again;$('menuBtn').setAttribute('aria-label',t.menu);$('pTitle').textContent=t.paused;$('resumeBtn').textContent=t.resume;$('pMenuBtn').textContent=t.menu}
function pitchesOf(s){const ps=[];s.score.tiles.forEach(t=>{for(let k=1;k<t.ns.length;k+=4)ps.push(t.ns[k]);for(let k=1;k<t.ch.length;k+=4)ps.push(t.ch[k])});return ps}
async function pick(s){audio();if(!isOpen(s)){toast(T().needMore(s.need-totalStars()));return}
  const ps=pitchesOf(s);if(ps.some(p=>!bank[p])){showOnly('loading');$('lTitle').textContent=T().loading;$('lSub').textContent='';state='loading';await new Promise(r=>setTimeout(r,30));try{await prepare(ps)}catch(e){}}
  begin(s)}
function endGame(win){const before=totalStars();state='over';$('mark').hidden=true;mk=null;holds.clear();$('hud').hidden=true;if(!win)stopAll();
  const st=starsNow;
  const b=save.best[song.id]||{score:0,stars:0};const nb=score>b.score;
  if(!save.test){save.best[song.id]={score:Math.max(b.score,score),stars:Math.max(b.stars,st)};persist()}
  const opened=SONGS.filter(s=>s.need>before&&s.need<=totalStars());applyText();
  $('oTitle').textContent=win?T().win:T().fail;$('oTitle').style.color=win?'var(--yel)':'var(--red)';
  $('oSong').textContent=song.title[save.lang];$('oScore').textContent=score;$('oStars').innerHTML=st>3?[1,2,3].map(k=>crownSvg(k<=st-3)).join(''):starsRow(st);
  {const tot=totalStars(),nx=SONGS.find(s=>s.need>tot);$('oNext').innerHTML=`${T().total}: <b>${tot} ★</b><br>`+(nx?T().nextUp(esc(nx.title[save.lang]),nx.need-tot):T().allOpen)}
  $('oBest').className=nb&&!save.test?'ribbon':'';$('oBest').textContent=opened.length?`${T().unlocked} ${opened.map(s=>s.title[save.lang]).join(', ')}`:nb&&!save.test?T().newBest:`${T().best}: ${(save.best[song.id]||b).score}`;showOnly('over')}
function toMenu(){$('mark').hidden=true;mk=null;stopAll();state='menu';$('hud').hidden=true;applyText();showOnly('menu')}
function pause(){if(state!=='play')return;state='paused';if(ac)ac.suspend();showOnly('pauseScr')}
function resume(){if(state!=='paused')return;state='play';showOnly(null);if(ac)ac.resume();last=performance.now()}
$('againBtn').onclick=()=>pick(song);$('menuBtn').onclick=toMenu;$('pMenuBtn').onclick=()=>{if(ac)ac.resume();toMenu()};$('resumeBtn').onclick=resume;$('pauseBtn').onclick=pause;
$('setBtn').onclick=()=>{applyText();showOnly('settings')};$('setClose').onclick=()=>{applyText();showOnly('menu')};
$('soundBtn').onclick=()=>{save.sound=!save.sound;persist();applyText();if(save.sound)prepare([72]).then(()=>note(72,0,.8))};
$('lyrBtn').onclick=()=>{save.lyrics=!save.lyrics;persist();applyText()};
$('testBtn').onclick=()=>{if(!save.admin)return;save.test=!save.test;persist();applyText()};
$('adminBtn').onclick=()=>{if(save.admin){save.admin=false;save.test=false;persist();applyText();return}const c=prompt(T().adminAsk);if(c===null)return;if(c.trim()===ADMIN_CODE){save.admin=true;persist();applyText();toast(T().adminOn)}else toast(T().adminBad)};
$('langBtn').onclick=()=>{save.lang=save.lang==='ru'?'en':'ru';persist();applyText()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.__yekaTiles={get state(){return state},get scroll(){return scroll},get tiles(){return tiles},get score(){return score},get hits(){return hits},hitNext:(id='bot')=>{const t=nextTile();if(t)hit(t,id)},release,step:(dt)=>update(dt),get starsNow(){return starsNow},songs:()=>SONGS.map(s=>({id:s.id,need:s.need,open:isOpen(s),tiles:s.score.tiles.length}))};
applyText();showOnly('menu');requestAnimationFrame(frame);
})();
